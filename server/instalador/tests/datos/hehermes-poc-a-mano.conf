# Una conexión de swanctl escrita a mano, sin la cabecera de hehermes-dispositivo, como la de una instalación a mano
# (`server/vpn/README.md`, la tabla de «VPN IKEv2 nativa»). El secreto es inventado: el hexadecimal de
# «clave-inventada-del-poc».
connections {
    hh-iphone-poc {
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384
        encap = yes
        pools = hh-poc
        local {
            auth = psk
        }
        remote {
            auth = psk
            id = iphone-poc
        }
        children {
            hh-iphone-poc {
                local_ts = 10.77.0.1/32
                esp_proposals = aes256gcm16-ecp384
                if_id_in = 0x77
                if_id_out = 0x77
            }
        }
    }
}
pools {
    hh-poc {
        addrs = 10.77.1.2/32
    }
}
secrets {
    ike-poc {
        id = iphone-poc
        secret = 0x636c6176652d696e76656e746164612d64656c2d706f63
    }
}
