# /etc/nginx/hehermes-avisos/sitio/avisos.conf
# El vigía de avisos, dentro del servidor del túnel (server/vpn/hehermes-tunel.nginx). Se incluye DENTRO de su
# `server { … }`, antes de `location / { … }`, con comodín, para que el sitio no dependa de que esto esté instalado:
#
#     include /etc/nginx/hehermes-avisos/sitio/*.conf;
#
# La app habla con el vigía en la misma base que con Hermes (http://10.77.0.1/avisos/v1/…), y la credencial del iPhone
# es la misma: su VPN.
location /avisos/ {
    # Solo lo que llega por el túnel: los iPhone de WireGuard (10.77.0.0/24) y los de IKEv2 (10.77.1.0/24). Todo lo que
    # llega a 10.77.0.1:80 pasa por aquí, y nginx le pone el secreto de abajo, así que sin esto cualquier proceso del VPS
    # entraría en el vigía: los de la propia máquina llegan desde 10.77.0.1, y el `deny all` cierra también cualquier
    # otro origen que se pueda atar a mano (127.0.0.1 con `curl --interface`, por ejemplo). Va solo en esta location: la
    # de Hermes (`location /`) es cosa de Daniel.
    deny 10.77.0.1;
    allow 10.77.0.0/24;
    allow 10.77.1.0/24;
    deny all;

    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;

    # El vigía no es Hermes: aquí NO se incluye hehermes-bearer.conf, y cualquier Authorization que mande el cliente
    # se borra. La clave del api_server no sale de `location /`.
    proxy_set_header Authorization "";
    # El secreto que prueba que la petición ha pasado por aquí: `proxy_set_header X-HeHermes-Vigia "…";`, en un fichero
    # de root en 0600 que crea el instalador. Sustituye cualquier X-HeHermes-Vigia que mande el cliente. El vigía escucha
    # en 127.0.0.1 y no atiende nada sin él, así que quien le hable directo, sin pasar por nginx, se queda fuera; y el
    # allow/deny de arriba deja pasar por nginx solo lo que llega por el túnel. Hacen falta las dos cosas.
    # Con comodín y en su propia carpeta: si falta, nginx arranca igual y no pone la cabecera, así que el vigía contesta
    # 403 (falla cerrado); y como la carpeta es solo suya, ningún comodín del server {} puede meterlo a ese nivel.
    include /etc/nginx/hehermes-avisos/secreto/*.conf;

    # Los cuerpos de la app son de unos cientos de bytes.
    client_max_body_size 64k;
    proxy_connect_timeout 3s;
    # El aviso de prueba espera a que Apple conteste (el vigía corta a los 8 s; la app espera 10).
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    # Las rutas llevan el token del iPhone entero (PUT /avisos/v1/dispositivos/<token>/…): no se apuntan. El registro de
    # errores, solo lo crítico, porque un 502 apunta la línea de la petición con el token dentro; si el vigía no
    # contesta, lo dice su propio registro (journalctl -u hehermes-vigia).
    access_log off;
    error_log /var/log/nginx/hehermes-avisos.error.log crit;
}
